services:

  postgres:
    image: postgres:17-alpine
    container_name: sentinelx-postgres

    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx_dev_password

    ports:
      - "5433:5432"

    volumes:
      - sentinelx_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U sentinelx -d sentinelx"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sentinelx_postgres_data:
