services:

  sentinelx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelx-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - kafka
    networks:
      - sentinelx-network

  sentinelx-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelx-worker
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - kafka
    networks:
      - sentinelx-network

  postgres:
    image: postgres:16
    container_name: sentinelx-postgres
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - sentinelx-postgres-data:/var/lib/postgresql/data
    networks:
      - sentinelx-network

  redis:
    image: redis:7
    container_name: sentinelx-redis
    ports:
      - "6379:6379"
    networks:
      - sentinelx-network

  kafka:
    image: bitnami/kafka:3.8
    container_name: sentinelx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: yes
    networks:
      - sentinelx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sentinelx-network

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelx-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - sentinelx-network

volumes:
  sentinelx-postgres-data:

networks:
  sentinelx-network:
    driver: bridge
